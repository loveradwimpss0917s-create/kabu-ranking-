<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株ランキング｜今日の候補スクリーニング</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --txt:#e8eaee; --sub:#9aa3b2; --up:#e5484d; --down:#3d9be9; --gold:#f5b83d; }
  /* 日本の慣例: 上昇=赤, 下落=青 */
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:12px; }
  main { max-width:720px; margin:0 auto; padding:12px; }
  .market { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .market .big { font-size:26px; font-weight:700; }
  .regime { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#5a1f22; color:#ffb3b8; border:1px solid #8a2f35; }
  .regime.normal { background:#17351f; color:#a7e8b5; border-color:#2f6b3a; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .rank { font-size:20px; font-weight:800; color:var(--gold); min-width:34px; }
  .name { font-size:16px; font-weight:700; }
  .code { color:var(--sub); font-size:12px; }
  .price { margin-left:auto; text-align:right; }
  .score { font-size:20px; font-weight:800; }
  .chg.up { color:var(--up); } .chg.down { color:var(--down); }
  .bars { margin:8px 0; }
  .bar { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub); margin:2px 0; }
  .bar .lbl { width:86px; }
  .bar .track { flex:1; height:6px; background:#262a33; border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--gold); }
  .bar .val { width:34px; text-align:right; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin:2px 4px 2px 0; }
  .tag.reason { background:#22331f; color:#b9e4ae; }
  .tag.risk { background:#3a2326; color:#f0a8ad; }
  .meta { font-size:11px; color:var(--sub); margin-top:6px; }
  .levels { font-size:12px; margin-top:8px; background:#14171d; border:1px solid var(--line); border-radius:8px; padding:7px 9px; line-height:1.7; }
  .levels b { font-size:13px; }
  .disc { font-size:11px; color:var(--sub); padding:10px 2px 24px; line-height:1.6; }
  svg.spark { vertical-align:middle; }
</style>
</head>
<body>
<header>
  <h1>📊 今日の株ランキング</h1>
  <div class="sub">チャート形状・テクニカル指標・出来高から候補をスコア化（スクリーニング）</div>
</header>
<main>
  <section class="market" id="market">読み込み中…</section>
  <section id="list"></section>
  <p class="disc" id="disc"></p>
</main>
<script>
const LABELS = { relative_strength:"相対強さ", oversold:"売られ過ぎ", reversal:"反転サイン", trend:"トレンド", liquidity_risk:"流動性/リスク", stabilizing:"下げ止まり" };
const MAXES  = { relative_strength:25, oversold:20, reversal:20, trend:15, liquidity_risk:10, stabilizing:10 };
function sparkSvg(vals){
  const w=96,h=28,min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-min)/rg)*(h-4)).toFixed(1)}`).join(" ");
  const col = vals[vals.length-1] >= vals[0] ? "#e5484d" : "#3d9be9";
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}
fetch("data/ranking.json").then(r=>r.json()).then(d=>{
  const m=d.market;
  const chgCls = m.index_change_pct>=0 ? "up":"down";
  document.getElementById("market").innerHTML = `
    <div class="row"><span>${m.index_name}</span><span class="regime ${m.regime==="normal"?"normal":""}">${m.regime_label}</span></div>
    <div class="big">${m.index_value.toLocaleString("ja-JP",{maximumFractionDigits:0})} <span class="chg ${chgCls}" style="font-size:18px">${m.index_change_pct>=0?"+":""}${m.index_change_pct}%</span></div>
    <div class="sub">対象 ${m.universe_size}銘柄中、値上がり ${m.advancers} / 値下がり ${m.decliners}｜生成: ${new Date(d.generated_at).toLocaleString("ja-JP")}<br>ユニバース: ${m.universe_source||""}｜${m.note||""}</div>`;
  document.getElementById("disc").textContent = d.disclaimer + (d.errors&&d.errors.length ? ` 除外銘柄: ${d.errors.map(e=>e.code+"（"+e.error+"）").join("、")}` : "");
  document.getElementById("list").innerHTML = d.ranking.map((r,i)=>`
    <article class="card">
      <div class="row">
        <span class="rank">${i+1}</span>
        <span class="name">${r.name}</span><span class="code">${r.code}${r.sector ? "・"+r.sector : ""}</span>
        ${sparkSvg(r.spark)}
        <span class="price"><span class="score">${r.score}</span><span class="sub"> 点</span><br>
        <span>${r.price.toLocaleString("ja-JP")}円</span> <span class="chg ${r.change_pct>=0?"up":"down"}">${r.change_pct>=0?"+":""}${r.change_pct}%</span></span>
      </div>
      <div class="bars">${Object.keys(LABELS).map(k=>`
        <div class="bar"><span class="lbl">${LABELS[k]}</span><span class="track"><span class="fill" style="display:block;width:${(r.breakdown[k]/MAXES[k]*100).toFixed(0)}%"></span></span><span class="val">${r.breakdown[k]}/${MAXES[k]}</span></div>`).join("")}
      </div>
      <div>${r.reasons.map(t=>`<span class="tag reason">${t}</span>`).join("")}${r.risks.map(t=>`<span class="tag risk">⚠ ${t}</span>`).join("")}</div>
      ${r.levels ? `<div class="levels">購入目標 <b>${r.levels.entry.toLocaleString("ja-JP")}円</b>（押し目目安）｜利確目標 <b>${r.levels.take_profit.toLocaleString("ja-JP")}円</b>（+${r.levels.reward_pct}%・${r.levels.tp_basis}）｜損切り <b>${r.levels.stop_loss.toLocaleString("ja-JP")}円</b>（-${r.levels.risk_pct}%）｜リスクリワード ${r.levels.rr}</div>` : ""}
      <div class="meta">RSI ${r.rsi}｜25日線乖離 ${r.dev25_pct}%｜6か月高値から ${r.dd_from_high_pct}%｜出来高 ${r.vol_ratio}倍｜ATR ${r.atr_pct}%<br>無効条件: ${r.invalid_if}｜目標価格はATR(14)基準の機械的な目安（購入=現在値−0.5ATR、損切り=購入−1ATR、利確=購入+2ATRまたは25日線）</div>
    </article>`).join("");
}).catch(e=>{ document.getElementById("market").textContent="データ読み込みに失敗しました: "+e; });
</script>
</body>
</html>
